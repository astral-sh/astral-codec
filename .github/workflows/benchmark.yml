name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - .github/workflows/benchmark.yml
      - scripts/bench-zip.py
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - uv.lock
      - crates/archive-trait/**
      - crates/tar-codec/**
      - crates/tar-framing/**
      - crates/zip-codec/**
      - crates/zip-framing/**
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark.yml
      - scripts/bench-zip.py
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - uv.lock
      - crates/archive-trait/**
      - crates/tar-codec/**
      - crates/tar-framing/**
      - crates/zip-codec/**
      - crates/zip-framing/**
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      compare:
        description: Compare implementations
        type: boolean
        default: false

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  RUSTUP_TOOLCHAIN: stable

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  benchmark-simulation:
    name: CodSpeed (${{ matrix.package }}, ${{ matrix.target }}, simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - package: tar-framing
            target: framing
          - package: zip-framing
            target: framing
          - package: zip-codec
            target: codec
          - package: zip-codec
            target: comparison
    permissions:
      contents: read
      id-token: write # Authenticate uploads to CodSpeed with OIDC.
    env:
      COMPARE_IMPLEMENTATIONS: >-
        ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmarks:compare')) ||
            (github.event_name == 'workflow_dispatch' && inputs.compare) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build benchmarks
        run: uv run --only-dev --locked cargo codspeed build -p ${{ matrix.package }} --bench ${{ matrix.target }} --locked -m simulation

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: |
            if [ "${{ matrix.target }}" != "comparison" ] || [ "$COMPARE_IMPLEMENTATIONS" = "true" ]; then
              uv run --only-dev --locked cargo codspeed run -p ${{ matrix.package }} --bench ${{ matrix.target }} -m simulation
            else
              uv run --only-dev --locked cargo codspeed run -p zip-codec --bench comparison -m simulation -- '/zip-codec(\]|$)'
            fi

  benchmark-comparison-build:
    name: Build comparison benchmarks (${{ matrix.package }})
    # Match the macro runner's architecture and Ubuntu version.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    strategy:
      matrix:
        package: [tar-codec, zip-codec]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build benchmarks
        run: uv run --only-dev --locked cargo codspeed build -p ${{ matrix.package }} --bench comparison --locked -m walltime

      - name: Archive benchmarks
        run: tar -cf benchmarks-walltime.tar target/codspeed

      - name: Upload benchmarks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-walltime-${{ matrix.package }}
          path: benchmarks-walltime.tar
          if-no-files-found: error
          retention-days: 1

  benchmark-comparison-run:
    name: CodSpeed (${{ matrix.package }}, comparison, walltime)
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    needs: benchmark-comparison-build
    timeout-minutes: 20
    strategy:
      matrix:
        package: [tar-codec, zip-codec]
    permissions:
      contents: read
      id-token: write # Authenticate uploads to CodSpeed with OIDC.
    env:
      COMPARE_IMPLEMENTATIONS: >-
        ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmarks:compare')) ||
            (github.event_name == 'workflow_dispatch' && inputs.compare) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install Rust
        # cargo-codspeed needs Cargo to read workspace metadata.
        run: rustup toolchain install stable --profile minimal

      - name: Download benchmarks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmarks-walltime-${{ matrix.package }}

      - name: Extract benchmarks
        run: tar -xf benchmarks-walltime.tar

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          run: |
            if [ "${{ matrix.package }}" = "zip-codec" ]; then
              if [ "$COMPARE_IMPLEMENTATIONS" = "true" ]; then
                uv run --only-dev --locked python scripts/bench-zip.py --fixed-layout --compare
              else
                uv run --only-dev --locked python scripts/bench-zip.py --fixed-layout
              fi
            elif [ "$COMPARE_IMPLEMENTATIONS" = "true" ]; then
              uv run --only-dev --locked cargo codspeed run -p ${{ matrix.package }} --bench comparison -m walltime
            else
              uv run --only-dev --locked cargo codspeed run -p ${{ matrix.package }} --bench comparison -m walltime -- '/${{ matrix.package }}(\]|$)'
            fi
