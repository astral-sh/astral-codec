name: Benchmarks
run-name: ZIP CRC interleaving on native x64

on:
  workflow_dispatch:

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  RUSTUP_TOOLCHAIN: stable

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.run_id }}

jobs:
  crc-x64:
    name: Native x64 CRC comparison (${{ matrix.trial }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/zip-crc-target
      WHEEL_CORPUS_DIR: ${{ github.workspace }}/target/wheel-corpus
      BENCHMARK_TRIAL: ${{ matrix.trial }}
      BENCHMARK_BINARIES: ${{ github.workspace }}/target/zip-crc-binaries
      BENCHMARK_RESULTS: ${{ github.workspace }}/target/zip-crc-results
    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check out current PR baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: b2dea04fa6822a5969f83968fce6df923c8e8488
          path: baseline
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Check formatting and candidate
        run: |
          cargo fmt --all --check
          cargo clippy -p zip-codec --all-targets --locked -- -D warnings
          cargo test -p zip-codec --lib --test decode --test encode --locked

      - name: Fetch verified wheel fixtures
        run: uv run --locked crates/zip-codec/benches/wheels/fetch.py

      - name: Build both variants and run paired comparisons
        run: python3 scripts/bench-zip-crc-x64.py

      - name: Upload measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-crc-x64-${{ matrix.trial }}
          path: target/zip-crc-results
          if-no-files-found: warn
          retention-days: 14
