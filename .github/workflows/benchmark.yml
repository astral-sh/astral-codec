name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compare:
        description: Compare implementations
        type: boolean
        default: false

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  benchmark:
    name: CodSpeed (${{ matrix.bench }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tar-framing
            bench: framing
            mode: simulation
            runner: ubuntu-latest
          - package: tar-codec
            bench: comparison
            mode: walltime
            runner: codspeed-macro-arm64-graviton-ubuntu-22-04
    permissions:
      contents: read
      id-token: write # Authenticate uploads to CodSpeed with OIDC.
    env:
      RUSTUP_TOOLCHAIN: stable
      PACKAGE: ${{ matrix.package }}
      BENCHMARK: ${{ matrix.bench }}
      MEASUREMENT_MODE: ${{ matrix.mode }}
      COMPARE_IMPLEMENTATIONS: >-
        ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmarks:compare')) ||
            (github.event_name == 'workflow_dispatch' && inputs.compare) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build benchmarks
        run: uv run --only-dev --locked cargo codspeed build -p "$PACKAGE" --bench "$BENCHMARK" --locked -m "$MEASUREMENT_MODE"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: ${{ matrix.mode }}
          run: |
            if [ "$BENCHMARK" = "comparison" ] && [ "$COMPARE_IMPLEMENTATIONS" != "true" ]; then
              uv run --only-dev --locked cargo codspeed run -p "$PACKAGE" --bench "$BENCHMARK" -m "$MEASUREMENT_MODE" -- '/tar-codec(\]|$)'
            else
              uv run --only-dev --locked cargo codspeed run -p "$PACKAGE" --bench "$BENCHMARK" -m "$MEASUREMENT_MODE"
            fi
