name: Benchmarks

on:
  workflow_dispatch:

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  RUSTUP_TOOLCHAIN: stable

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build ZIP sampling experiment
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build benchmarks
        run: uv run --only-dev --locked cargo codspeed build -p zip-codec --bench comparison --locked -m walltime
      - name: Archive benchmarks
        run: tar -cf benchmarks-walltime.tar target/codspeed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-sampling-binary
          path: benchmarks-walltime.tar
          if-no-files-found: error
          retention-days: 3

  sampling:
    name: Compare ZIP sampling protocols
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zip-sampling-binary
      - name: Extract benchmarks
        run: tar -xf benchmarks-walltime.tar
      - name: Measure protocols
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          run: uv run --only-dev --locked python scripts/bench-zip-sampling.py
      - name: Upload observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-sampling-observations
          path: target/zip-sampling
          if-no-files-found: error
          retention-days: 3
