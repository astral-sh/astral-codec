name: Benchmarks

run-name: ZIP repeat (malloc=${{ inputs.allocator }}, pin=${{ inputs.pin_cpu }}, profile=${{ inputs.profile }}, isolate=${{ inputs.isolate_background }}, batch=${{ inputs.sample_size }})

on:
  workflow_dispatch:
    inputs:
      allocator:
        description: Allocator thresholds
        type: choice
        options: [adaptive, fixed]
        default: adaptive
      pin_cpu:
        description: Pin the benchmark process to the last allowed CPU
        type: boolean
        default: false
      profile:
        description: Enable walltime profiling
        type: boolean
        default: true
      isolate_background:
        description: Restrict background processes to CPUs 0-1
        type: boolean
        default: false
      sample_size:
        description: Operations per walltime sample
        type: choice
        options: [adaptive, '8', '32']
        default: adaptive

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  RUSTUP_TOOLCHAIN: stable

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.run_id }}

jobs:
  build:
    name: Build ZIP baseline verification
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build benchmarks
        run: uv run --only-dev --locked cargo codspeed build -p zip-codec --bench comparison --locked -m walltime
      - name: Archive benchmarks
        run: tar -cf benchmarks-walltime.tar target/codspeed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-verify-binary
          path: benchmarks-walltime.tar
          if-no-files-found: error
          retention-days: 14

  sampling:
    name: Repeat all ZIP comparisons
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zip-verify-binary
      - name: Extract benchmarks
        run: tar -xf benchmarks-walltime.tar
      - name: Inspect runner hooks
        run: |
          mkdir -p target/zip-runtime-hooks
          for hook in /usr/local/bin/codspeed-{pre,wrap,post}-bench; do
            if test -f "$hook"; then
              cp "$hook" target/zip-runtime-hooks/
            fi
          done
          systemctl show init.scope system.slice user.slice codspeed.slice --property=Id,AllowedCPUs,EffectiveCPUs > target/zip-runtime-hooks/cgroups.txt
      - name: Upload runner hooks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-runtime-hooks
          path: target/zip-runtime-hooks
          if-no-files-found: error
          retention-days: 14
      - name: Reserve benchmark CPUs
        if: ${{ inputs.isolate_background }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          units = ['init.scope', 'system.slice', 'user.slice']
          original = {unit: subprocess.check_output(['systemctl', 'show', unit, '--property=AllowedCPUs', '--value'], text=True).strip() for unit in units}
          Path('target/zip-runtime-hooks/original-cpus.json').write_text(json.dumps(original))
          for unit in units:
              subprocess.run(['sudo', 'systemctl', 'set-property', '--runtime', unit, 'AllowedCPUs=0-1'], check=True, timeout=30)
          PY
      - name: Repeat original benchmark suite
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        env:
          CODSPEED_PROFILER_ENABLED: ${{ inputs.profile }}
          VERIFY_PROFILE: ${{ inputs.profile }}
          VERIFY_PIN_CPU: ${{ inputs.pin_cpu }}
          VERIFY_ALLOCATOR: ${{ inputs.allocator }}
          VERIFY_SAMPLE_SIZE: ${{ inputs.sample_size }}
        with:
          mode: walltime
          run: uv run --only-dev --locked python scripts/bench-zip-verify.py --profile "$VERIFY_PROFILE" --pin-cpu "$VERIFY_PIN_CPU" --allocator "$VERIFY_ALLOCATOR" --sample-size "$VERIFY_SAMPLE_SIZE"
      - name: Restore CPU reservations
        if: ${{ always() && inputs.isolate_background }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          path = Path('target/zip-runtime-hooks/original-cpus.json')
          if path.exists():
              for unit, cpus in json.loads(path.read_text()).items():
                  subprocess.run(['sudo', 'systemctl', 'set-property', '--runtime', unit, 'AllowedCPUs=' + cpus], check=True, timeout=30)
          PY
      - name: Upload observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zip-verify-observations
          path: target/zip-runtime-verify
          if-no-files-found: error
          retention-days: 14
