name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - .github/workflows/benchmark.yml
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - uv.lock
      - crates/archive-trait/**
      - crates/tar-codec/**
      - crates/tar-framing/**
      - crates/zip-codec/**
      - crates/zip-framing/**
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark.yml
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - uv.lock
      - crates/archive-trait/**
      - crates/tar-codec/**
      - crates/tar-framing/**
      - crates/zip-codec/**
      - crates/zip-framing/**
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      compare:
        description: Compare implementations
        type: boolean
        default: false

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  RUSTUP_TOOLCHAIN: stable

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  benchmark-simulation:
    name: CodSpeed (${{ matrix.package }}, ${{ matrix.target }}, simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - package: tar-framing
            target: framing
          - package: zip-framing
            target: framing
          - package: zip-codec
            target: codec
            build-args: --features bench-allocator
          - package: zip-codec
            target: comparison
            build-args: --features bench-allocator
    permissions:
      contents: read
      id-token: write # Authenticate uploads to CodSpeed with OIDC.
    env:
      COMPARE_IMPLEMENTATIONS: >-
        ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmarks:compare')) ||
            (github.event_name == 'workflow_dispatch' && inputs.compare) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build benchmarks
        run: uv run --only-dev --locked cargo codspeed build -p ${{ matrix.package }} --bench ${{ matrix.target }} --locked -m simulation ${{ matrix.build-args }}

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: |
            if [ "${{ matrix.target }}" = "comparison" ] && [ "$COMPARE_IMPLEMENTATIONS" != "true" ]; then
              uv run --only-dev --locked cargo codspeed run -p ${{ matrix.package }} --bench ${{ matrix.target }} -m simulation -- '/${{ matrix.package }}(\]|$)'
            else
              uv run --only-dev --locked cargo codspeed run -p ${{ matrix.package }} --bench ${{ matrix.target }} -m simulation
            fi

  benchmark-comparison-build:
    name: Build comparison benchmarks (tar-codec)
    # Match the macro runner's architecture and Ubuntu version.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build benchmarks
        run: uv run --only-dev --locked cargo codspeed build -p tar-codec --bench comparison --locked -m walltime

      - name: Archive benchmarks
        run: tar -cf benchmarks-walltime.tar target/codspeed

      - name: Upload benchmarks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-walltime-tar-codec
          path: benchmarks-walltime.tar
          if-no-files-found: error
          retention-days: 1

  benchmark-comparison-run:
    name: CodSpeed (tar-codec, comparison, walltime)
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    needs: benchmark-comparison-build
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Authenticate uploads to CodSpeed with OIDC.
    env:
      COMPARE_IMPLEMENTATIONS: >-
        ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmarks:compare')) ||
            (github.event_name == 'workflow_dispatch' && inputs.compare) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rust
        # cargo-codspeed needs Cargo to read workspace metadata.
        run: rustup toolchain install stable --profile minimal

      - name: Download benchmarks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmarks-walltime-tar-codec

      - name: Extract benchmarks
        run: tar -xf benchmarks-walltime.tar

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: walltime
          run: |
            if [ "$COMPARE_IMPLEMENTATIONS" = "true" ]; then
              uv run --only-dev --locked cargo codspeed run -p tar-codec --bench comparison -m walltime
            else
              uv run --only-dev --locked cargo codspeed run -p tar-codec --bench comparison -m walltime -- '/tar-codec(\]|$)'
            fi
