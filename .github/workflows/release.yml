# Validate and publish a release, then create its tag and GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version to release, without a leading v
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  validate-release:
    name: Validate release
    if: github.repository == 'astral-sh/astral-codec' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Validate release metadata
        run: uv run --locked scripts/release.py --validate "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Verify release packages
        run: cargo publish --workspace --dry-run --locked

  release-gate:
    # N.B. This name should not change; the release environment gate relies on it.
    name: release-gate
    needs: validate-release
    runs-on: ubuntu-latest
    environment:
      name: release-gate
    permissions: {}
    steps:
      - run: echo "Release approved"

  publish-crates:
    name: Publish to crates.io
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write # for Trusted Publishing to crates.io
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-github:
    name: Create GitHub release
    needs: publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release and tag
        shell: bash
        run: |
          prerelease=()
          if [[ "${VERSION%%+*}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "astral-codec v${VERSION}" \
            --generate-notes \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
