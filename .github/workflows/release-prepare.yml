# Bump the workspace version and create a pull request.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version to release, without a leading v
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare release
    if: github.repository == 'astral-sh/astral-codec' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Bump version
        run: uv run --locked scripts/release.py "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create or update pull request
        uses: astral-sh/github-actions/create-release-pr@46d9685eed35b39a3d83a8dde3a3b4e1bff97a8a # 2026.11.19.0
        with:
          version: ${{ inputs.version }}
          tag-prefix: v
