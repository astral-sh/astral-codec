# Bump the workspace version and create a pull request.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version to release, without a leading v
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare release
    if: github.repository == 'astral-sh/astral-codec' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Bump version
        run: uv run --locked scripts/release.py "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create or update pull request
        uses: astral-sh/github-actions/create-release-pr@b18ab2e0c11d16711c1818c8774babfa0203b909 # 2026.10.08.0
        with:
          version: ${{ inputs.version }}
          tag-prefix: v
