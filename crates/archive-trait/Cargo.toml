[package]
name = "archive-trait"
description = "Format-neutral, asynchronous archive construction and extraction"
readme = "README.md"

version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[features]
default = ["fs"]
fs = ["dep:cap-std", "dep:walkdir", "dep:windows-sys", "tokio/fs", "tokio/rt", "tokio/sync"]

[dependencies]
cap-std = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
walkdir = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[target.'cfg(windows)'.dev-dependencies]
junction = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "builder"
required-features = ["fs"]

[[test]]
name = "extract"
required-features = ["fs"]

[[test]]
name = "links"
required-features = ["fs"]

[lib]
doctest = false
